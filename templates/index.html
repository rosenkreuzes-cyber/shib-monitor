<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SHIB Monitor v5.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0f14;color:#e8edf3;font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:560px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:4px 0}.status{padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}
.live{background:#123d27;color:#55e58a}.caution{background:#463811;color:#ffd45a}.offline{background:#471b20;color:#ff727d}
.price{text-align:center;font-size:30px;font-weight:800;margin:10px 0 2px}.sub{text-align:center;color:#9aa5b1;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.panel{background:#111820;border:1px solid #202a34;border-radius:12px;overflow:hidden}
.title{padding:8px 10px;font-size:13px;font-weight:800}.buy .title{color:#55e58a}.sell .title{color:#ff6875}
.level{position:relative;padding:7px 8px;border-top:1px solid #1b242d;min-height:48px}
.bar{position:absolute;top:0;bottom:0;opacity:.22}.buy .bar{right:0;background:#20c66b}.sell .bar{left:0;background:#ef5360}
.row{position:relative;display:flex;justify-content:space-between;gap:5px;font-size:11px}.qty{font-weight:700}.notional{font-size:10px;color:#9aa5b1;margin-top:4px}
.info{display:flex;justify-content:space-between;background:#111820;border:1px solid #202a34;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:11px;color:#aeb8c3}
</style>
</head>
<body><main class="wrap">
<div class="head"><h1>SHIB / JPY 板モニター</h1><span id="status" class="status offline">OFFLINE</span></div>
<div id="price" class="price">--</div><div id="source" class="sub">接続待機中</div>
<div class="grid">
<section class="panel buy"><div class="title">買い板</div><div id="bids"></div></section>
<section class="panel sell"><div class="title">売り板</div><div id="asks"></div></section>
</div>
<div class="info"><span>最良買い <b id="bid">--</b></span><span>最良売り <b id="ask">--</b></span></div>
<div class="info"><span>スプレッド <b id="spread">--</b></span><span>更新 <b id="age">--</b></span></div>
</main>
<script>
const $=id=>document.getElementById(id);
const fmtPrice=n=>n==null?"--":n.toFixed(8).replace(/0+$/,"").replace(/\.$/,"");
const fmtQty=n=>n==null?"--":Intl.NumberFormat("ja-JP",{notation:"compact",maximumFractionDigits:2}).format(n);
function renderLevels(id,levels,side){
 const el=$(id); el.innerHTML="";
 const max=Math.max(...levels.map(x=>x.notional),1);
 levels.forEach(x=>{
  const d=document.createElement("div");d.className="level";
  d.innerHTML=`<div class="bar" style="width:${Math.min(100,x.notional/max*100)}%"></div>
  <div class="row"><span>${fmtPrice(x.price)}</span><span class="qty">${fmtQty(x.amount)}</span></div>
  <div class="notional">¥${x.notional.toLocaleString("ja-JP",{maximumFractionDigits:0})}</div>`;
  el.appendChild(d);
 });
}
function render(s){
 window.lastTs=Date.now();
 $("price").textContent=fmtPrice(s.price);
 $("bid").textContent=fmtPrice(s.best_bid); $("ask").textContent=fmtPrice(s.best_ask);
 $("spread").textContent=s.spread_pct==null?"--":s.spread_pct.toFixed(3)+"%";
 $("source").textContent=(s.source==="coincheck_ws"?"● WebSocket LIVE":"● REST fallback");
 $("status").textContent=s.freshness;
 $("status").className="status "+s.freshness.toLowerCase();
 renderLevels("bids",s.bids,"bid");renderLevels("asks",s.asks,"ask");
}
function connect(){
 const proto=location.protocol==="https:"?"wss":"ws";
 const ws=new WebSocket(`${proto}://${location.host}/ws`);
 ws.onmessage=e=>render(JSON.parse(e.data));
 ws.onclose=()=>setTimeout(connect,2000);
}
connect();
setInterval(()=>{ if(window.lastTs) $("age").textContent=((Date.now()-window.lastTs)/1000).toFixed(1)+"s";},500);
</script>
</body></html>
