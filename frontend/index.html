<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b111b">
<title>SHIB/JPY OrderFlow</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#070c13;color:#e8edf3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.wrap{max-width:680px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:21px;margin:4px 0}.sub{color:#9aa5b1;font-size:12px;margin:0 0 8px}
.status,.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}
.green{color:#55e58a}.red{color:#ff727d}.yellow{color:#ffd45a}
.status{background:#471b20}.status.green{background:#123d27}.status.yellow{background:#463811}
.card{background:#0c1420;border:1px solid #1f2a37;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.price{text-align:center;font-size:30px;font-weight:850;margin:4px 0}.updated{text-align:center;color:#7f8b99;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{background:#101a28;border:1px solid #1d2937;border-radius:13px;overflow:hidden}
.title{padding:10px 12px;font-size:15px;font-weight:850}.buy .title{color:#55e58a}.sell .title{color:#ff6875}
.level{position:relative;padding:8px 9px;border-top:1px solid #1b2633;min-height:50px;overflow:hidden}
.bar{position:absolute;top:0;bottom:0;opacity:.20;pointer-events:none}.buy .bar{right:0;background:#20c66b}.sell .bar{left:0;background:#ef5360}
.row{position:relative;display:flex;justify-content:space-between;gap:6px;font-size:11px}.qty{font-weight:800}.notional{position:relative;font-size:10px;color:#8f9aa8;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#101a28;border-radius:12px;padding:10px}.label{color:#8995a4;font-size:11px}.value{font-size:17px;font-weight:800;margin-top:3px}
.score{text-align:center}.scoreTitle{color:#9aa5b1;font-size:13px}.scoreValue{font-size:34px;font-weight:900;margin:4px 0}.scoreBar,.meter{height:10px;border-radius:99px;background:#172332;overflow:hidden}.scoreFill,.meterFill{height:100%;width:0;background:#35cf82;border-radius:99px;transition:width .25s}
.verdict{font-size:22px;font-weight:900;margin:2px 0 6px}.muted{color:#8d98a6;font-size:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kv>div{background:#101a28;border-radius:12px;padding:10px}.tophead{display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 9px;color:#9aa5b1;font-size:11px}.bookrow{display:grid;grid-template-columns:1fr 1fr 1fr;padding:7px 9px;border-top:1px solid #1b2633;font-size:11px}.bookrow span:nth-child(2){text-align:center}.bookrow span:nth-child(3){text-align:right}
details summary{cursor:pointer;font-weight:800;color:#cbd3dc}.detail{white-space:pre-wrap;color:#9aa5b1;font-size:11px;line-height:1.6;margin-top:10px}
.controls{display:flex;gap:6px;margin-top:10px}.controls input{flex:1;min-width:0;background:#0d1520;color:#e8edf3;border:1px solid #263444;border-radius:9px;padding:8px;font-size:11px}.controls button{background:#1b2a3b;color:#e8edf3;border:1px solid #304257;border-radius:9px;padding:8px 11px;font-weight:800}
.alert{font-size:12px;padding:6px 0}.foot{color:#667384;font-size:10px;text-align:center;margin:12px 0}
@media(max-width:480px){.wrap{padding:10px}.grid{gap:8px}.card{padding:11px}.price{font-size:27px}}
</style>
</head>
<body><main class="wrap">
<div class="head"><div><h1>SHIB/JPY OrderFlow</h1><div class="sub">売買板監視・買い/売り強弱判定</div></div><span id="live" class="status">OFFLINE</span></div>

<div class="card">
  <div id="price" class="price">--</div>
  <div id="pair" class="sub" style="text-align:center">SHIB/JPY</div>
  <div id="updated" class="updated">最終更新 --</div>
</div>

<div class="card score">
  <div class="scoreTitle">総合判定</div>
  <div id="label" class="verdict">判定停止</div>
  <div><span id="score">--</span><span class="muted"> / 100</span></div>
  <div class="scoreTitle" style="margin:5px 0">買い強度スコア</div>
  <div class="scoreBar"><div id="scorebar" class="scoreFill"></div></div>
</div>

<div class="card">
  <div class="label" style="font-size:14px;margin-bottom:8px">板のバランス</div>
  <div class="stats">
    <div class="stat"><div class="label">買い板</div><div id="imb" class="value">--%</div><div id="wbid" class="muted">--</div></div>
    <div class="stat"><div class="label">売り板</div><div id="sell" class="value">--%</div><div id="wask" class="muted">--</div></div>
  </div>
  <div class="meter" style="margin:10px 0 7px"><div id="buybar" class="meterFill"></div></div>
  <div class="kv">
    <div><div class="label">板インバランス</div><b id="imbLabel">--</b></div>
    <div><div class="label">スプレッド</div><b id="spread">--</b></div>
    <div><div class="label">買いレベル</div><b id="bid">--</b></div>
    <div><div class="label">売りレベル</div><b id="ask">--</b></div>
  </div>
</div>

<div class="card">
  <div class="title" style="padding:0 0 8px">売買板（上位10段）</div>
  <div class="tophead"><span>買い数量</span><span style="text-align:center">価格</span><span style="text-align:right">売り数量</span></div>
  <div id="bookRows"></div>
</div>

<div class="card">
  <details>
    <summary>▶ 判定材料・通信状態</summary>
    <div id="alerts" style="margin-top:8px"></div>
    <div id="components"></div>
    <div id="detail" class="detail">接続待機中</div>
    <div class="controls"><input id="apiUrl" aria-label="API URL"><button id="save">保存</button></div>
  </details>
</div>
<div class="foot">データはCoincheck公開板を使用。画面のスコアは板データからの参考値です。</div>
</main>
<script src="./app.js"></script>
</body></html>
