<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><title>SHIB/JPY OrderFlow Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b1220ee;padding:12px 14px;border-bottom:1px solid #202938;backdrop-filter:blur(10px)}
h1{font-size:19px;margin:0 0 3px}.sub,.muted{font-size:12px;color:#94a3b8}main{max-width:760px;margin:auto;padding:8px 10px 28px}
.card{background:#0d1421;border:1px solid #202938;border-radius:14px;padding:13px;margin:9px 0}.row{display:flex;gap:9px}.row>*{flex:1}
.price{font-size:30px;font-weight:800}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}
.live{background:#123a2a;color:#6ee7a8}.caution{background:#3b3010;color:#fcd34d}.off{background:#3b1520;color:#fda4af}
.verdict{text-align:center;padding:17px 10px}.label{font-size:27px;font-weight:900;margin:7px 0}.score{font-size:46px;font-weight:900}
.bar{height:11px;background:#202938;border-radius:8px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;transition:width .3s}
.buybar{background:#35d07f}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#111a29;border-radius:11px;padding:10px}.metric b{display:block;font-size:17px;margin-top:3px}
.book{display:grid;grid-template-columns:1fr 1fr;gap:8px}h3{font-size:14px;margin:0 0 6px}table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:5px 3px;border-bottom:1px solid #1d2635}td:last-child{text-align:right}.buy td:first-child{color:#6ee7a8}.sell td:first-child{color:#fda4af}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}button{width:100%;padding:11px;border:0;border-radius:10px;background:#1d293a;color:white;font-weight:700}
@media(max-width:430px){main{padding:7px}.price{font-size:27px}.label{font-size:24px}}
</style></head><body>
<header><h1>SHIB/JPY OrderFlow</h1><div class="sub">売買板監視・買い/売り強弱判定</div></header>
<main>
<section class="card"><div class="row">
<div><div class="muted">現在価格</div><div id="price" class="price">--</div></div>
<div style="text-align:right"><div class="muted">状態</div><div id="state" class="badge off">取得中</div><div id="updated" class="muted" style="margin-top:7px">--</div></div>
</div><div class="split" style="margin-top:10px">
<div class="metric"><span class="muted">最良買い</span><b id="bid">--</b></div><div class="metric"><span class="muted">最良売り</span><b id="ask">--</b></div>
</div></section>
<section class="card verdict"><div class="muted">総合判定</div><div id="label" class="label">判定中</div><div id="score" class="score">--</div><div class="muted">買い強度スコア / 100</div><div class="bar"><i id="scorebar" class="buybar"></i></div></section>
<section class="card"><div class="muted">板のバランス</div><div class="split" style="margin-top:8px">
<div class="metric"><span class="muted">買い板</span><b id="buyPct">--%</b><div id="buyQty" class="muted">--</div></div>
<div class="metric"><span class="muted">売り板</span><b id="sellPct">--%</b><div id="sellQty" class="muted">--</div></div>
</div><div class="bar"><i id="imbbar" class="buybar"></i></div><div class="kv">
<div><span class="muted">板インバランス</span><br><b id="imb">--</b></div><div><span class="muted">スプレッド</span><br><b id="spread">--</b></div>
<div><span class="muted">買いレベル</span><br><b id="blv">--</b></div><div><span class="muted">売りレベル</span><br><b id="alv">--</b></div>
</div></section>
<section class="card"><div class="muted">売買板（上位10段）</div><div class="book" style="margin-top:8px">
<div class="buy"><h3>買い板</h3><table><tbody id="bids"></tbody></table></div><div class="sell"><h3>売り板</h3><table><tbody id="asks"></tbody></table></div>
</div></section>
<section class="card"><details><summary>判定材料・通信状態</summary><div class="kv" style="margin-top:10px">
<div><span class="muted">板のインバランス</span><br><b id="c1">--</b></div><div><span class="muted">板の厚み比率</span><br><b id="c2">--</b></div>
<div><span class="muted">トレードフロー</span><br><b id="c3">--</b></div><div><span class="muted">価格モメンタム</span><br><b id="c4">--</b></div>
<div><span class="muted">巨大注文</span><br><b id="c5">--</b></div><div><span class="muted">大口約定</span><br><b id="c6">--</b></div>
<div><span class="muted">データ源</span><br><b id="source">--</b></div><div><span class="muted">WebSocket</span><br><b id="ws">--</b></div>
</div></details></section>
<section class="card"><button onclick="load()">今すぐ更新</button></section>
</main>
<script>
const $=id=>document.getElementById(id), fmt=(n,d=8)=>n==null?'--':Number(n).toFixed(d);
const qty=n=>n==null?'--':Number(n).toLocaleString('ja-JP',{maximumFractionDigits:4});
function rows(a){return (Array.isArray(a)?a:[]).slice(0,10).map(x=>`<tr><td>${fmt(x.price,8)}</td><td>${qty(x.amount)}</td></tr>`).join('')||'<tr><td colspan="2">--</td></tr>'}
function state(f,a){let e=$('state');e.className='badge '+(f==='LIVE'?'live':f==='CAUTION'?'caution':'off');e.textContent=f||'UNKNOWN';$('updated').textContent=a==null?'--':`更新 ${Number(a).toFixed(1)}秒前`}
async function load(){try{let r=await fetch('/api/orderbook?ts='+Date.now(),{cache:'no-store'}),d=await r.json(),b=d.book||{},c=d.score_components||{};
$('price').textContent=fmt(d.price);$('bid').textContent=fmt(b.best_bid);$('ask').textContent=fmt(b.best_ask);$('label').textContent=d.label||'判定中';$('score').textContent=d.score==null?'--':Number(d.score).toFixed(1);
$('scorebar').style.width=Math.max(0,Math.min(100,Number(d.score)||0))+'%';let buy=Number(b.imbalance_pct??50),sell=100-buy;
$('buyPct').textContent=buy.toFixed(1)+'%';$('sellPct').textContent=sell.toFixed(1)+'%';$('buyQty').textContent='数量 '+qty(b.bid_qty);$('sellQty').textContent='数量 '+qty(b.ask_qty);$('imbbar').style.width=Math.max(0,Math.min(100,buy))+'%';
$('imb').textContent=(buy-50>=0?'+':'')+(buy-50).toFixed(1)+'%';$('spread').textContent=b.spread_pct==null?'--':Number(b.spread_pct).toFixed(4)+'%';$('blv').textContent=b.bid_levels??'--';$('alv').textContent=b.ask_levels??'--';
$('bids').innerHTML=rows(b.bids_top10);$('asks').innerHTML=rows(b.asks_top10);$('c1').textContent=fmt(c['板のインバランス'],2);$('c2').textContent=fmt(c['板の厚み比率'],2);$('c3').textContent=fmt(c['トレードフロー'],2);$('c4').textContent=fmt(c['価格モメンタム'],2);$('c5').textContent=fmt(c['巨大注文'],2);$('c6').textContent=fmt(c['大口約定'],2);$('source').textContent=d.source||'--';$('ws').textContent=d.ws_connected?'接続中':'REST更新';state(d.freshness,b.snapshot_age_sec)
}catch(e){$('state').className='badge off';$('state').textContent='通信エラー'}}load();setInterval(load,2000);
</script></body></html>
