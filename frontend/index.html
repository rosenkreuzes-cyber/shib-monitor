<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09101f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>SHIB Monitor OrderFlow v5</title></head><body><main><header><div><h1>SHIB / JPY</h1><small id="connection">接続中...</small> ・ <small id="version">v5.0</small></div><button id="notifyBtn">通知を許可</button></header><div class="price" id="price">--</div><div class="signal"><small>総合圧力</small><div id="score">--</div><b id="label">--</b><small id="source">--</small></div><section class="grid"><article><h2>板インバランス</h2><p>買い <b id="bid">--</b></p><div class="bar"><i id="bidbar"></i></div><p>売り <b id="ask">--</b></p><p>レベル <b id="levels">--</b></p></article><article><h2>約定フロー 10秒</h2><p>買い <b id="tb">--</b></p><div class="bar"><i id="tbar"></i></div><p>売り <b id="ts">--</b></p></article><article><h2>板の急変 5秒</h2><p>買い <b id="bookBuy">--</b></p><p>売り <b id="bookSell">--</b></p><p>イベント <b id="events">--</b></p></article><article><h2>巨大注文</h2><div id="walls">--</div></article><article><h2>大口約定</h2><p>買い <b id="largeBuy">--</b></p><p>売り <b id="largeSell">--</b></p></article><article><h2>吸収候補</h2><p>買い <b id="absBuy">--</b></p><p>売り <b id="absSell">--</b></p></article></section><article class="settings"><h2>通知設定</h2><label>🟢買い急上昇 <input id="buyEnabled" type="checkbox" checked></label><label>🔴売り急上昇 <input id="sellEnabled" type="checkbox" checked></label><label>しきい値 <input id="threshold" type="number" value="10" min="1"> pt</label><label>クールダウン <input id="cooldown" type="number" value="60" min="5"> 秒</label></article><pre id="detail">データ待ち...</pre></main><div id="popup"><b id="popupTitle"></b><div id="popupText"></div></div><script src="app.js"></script></body></html>
